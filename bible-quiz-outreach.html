<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캠페인 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(to bottom, #1e1b4b, #312e81, #0f172a);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
    font-size: 17px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 26px; text-align: center; margin: 0 0 28px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .badge { background:#fbbf24; color:#1e1b4b; border-radius:999px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  p.sub { color:#a5b4fc; font-size:17px; text-align:center; margin-bottom:28px; line-height:1.5; }
  .btn {
    width:100%; border:none; border-radius:14px; padding:20px; font-weight:700; font-size:19px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-primary { background:#fbbf24; color:#1e1b4b; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-secondary { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); }
  .qcard { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:26px 22px; margin-bottom:20px; }
  .qcard p { font-size:23px; font-weight:700; line-height:1.45; margin:0; }
  .options { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .opt {
    text-align:left; padding:18px 20px; border-radius:14px; font-size:18px; font-weight:600;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#fff; cursor:pointer;
    line-height:1.4;
  }
  .opt.selected { background:rgba(251,191,36,.25); border-color:#fbbf24; }
  .opt.correct { background:rgba(16,185,129,.3); border-color:#34d399; }
  .opt:disabled { cursor:default; }
  .explain-box { background:rgba(16,185,129,.1); border:1px solid rgba(52,211,153,.3); border-radius:14px; padding:20px; margin-bottom:20px; }
  .explain-box p { font-size:17px; line-height:1.65; margin:0 0 10px; }
  .replay { background:none; border:none; color:#6ee7b7; font-size:15px; text-decoration:underline; cursor:pointer; padding:0; }
  .row-top { display:flex; justify-content:space-between; align-items:center; font-size:15px; color:#a5b4fc; margin-bottom:16px; }
  .concerns { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:28px; }
  .concern-btn { padding:22px; border-radius:14px; font-weight:700; font-size:18px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; cursor:pointer; }
  .concern-btn.selected { background:rgba(251,113,133,.25); border-color:#fb7185; color:#fecdd3; }
  input[type=text], input[type=tel] {
    width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px;
    padding:18px 20px; color:#fff; font-size:18px; margin-bottom:14px; outline:none;
  }
  input::placeholder { color:#818cf8; }
  .center { text-align:center; }
  .err { color:#f87171; font-size:16px; text-align:center; margin-bottom:14px; }
  .hidden { display:none; }
  .heart { font-size:44px; margin-bottom:10px; }
  .thanks-icon { font-size:72px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="badge">🎉</span> 캠페인 퀴즈</h1>
  <p class="sub" style="margin-top:-16px; font-weight:700; color:#fbbf24;">3개 이상 맞추면 선물이 팡팡!!</p>

  <!-- 시작 화면 -->
  <div id="stage-setup">
    <p class="sub">가볍게 즐기는 상식 퀴즈 6개와 성경 퀴즈 1개, 그리고 함께 나눌 고민을 골라보는 시간을 가집니다.</p>
    <button class="btn btn-primary" onclick="startQuiz()">시작하기</button>
  </div>

  <!-- 문제 화면 -->
  <div id="stage-question" class="hidden">
    <div class="row-top">
      <span id="qcounter"></span>
      <span>편하게 답해보세요</span>
    </div>
    <div class="qcard"><p id="qtext"></p></div>
    <div class="options" id="options"></div>
    <button class="btn btn-primary hidden" id="btn-reveal" onclick="reveal()">정답 공개</button>

    <div id="reveal-block" class="hidden">
      <div class="explain-box">
        <p id="explaintext"></p>
        <button class="replay" onclick="speak(currentQ().explain)">🔊 다시 듣기</button>
      </div>
      <button class="btn btn-primary" id="btn-next" onclick="nextAfterReveal()">다음 문제 →</button>
    </div>
  </div>

  <!-- 고민 선택 -->
  <div id="stage-concerns" class="hidden">
    <div class="center">
      <div class="heart">💗</div>
      <p style="font-weight:700; font-size:18px; margin:4px 0;">요즘 마음에 있는 고민이 있다면</p>
      <p class="sub">해당하는 것을 모두 골라주세요</p>
    </div>
    <div class="concerns" id="concernsGrid"></div>
    <button class="btn btn-primary" onclick="goConcernDetail()">다음 →</button>
  </div>

  <!-- 고민 직접 작성 -->
  <div id="stage-concern-detail" class="hidden">
    <p class="sub">조금 더 편하게 이야기해주셔도 좋아요 (선택)</p>
    <textarea id="concernNote" rows="5" placeholder="자유롭게 적어주세요..." style="width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:16px; color:#fff; font-size:17px; margin-bottom:20px; outline:none; resize:vertical; font-family:inherit;"></textarea>
    <button class="btn btn-primary" onclick="goContact()">다음 →</button>
  </div>

  <!-- 연락처 -->
  <div id="stage-contact" class="hidden">
    <p class="sub">나중에 더 이야기 나눌 수 있도록 연락처를 남겨주세요</p>
    <input type="text" id="nameInput" placeholder="이름" />
    <input type="tel" id="phoneInput" placeholder="연락처 (010-0000-0000)" />
    <label style="display:flex; align-items:flex-start; gap:10px; font-size:14px; color:#c7d2fe; margin-bottom:16px; line-height:1.5; cursor:pointer;">
      <input type="checkbox" id="agreeCheck" style="width:20px; height:20px; margin-top:2px; flex-shrink:0;" />
      <span>입력하신 이름과 연락처는 상담 및 후속 안내 목적으로만 활용되며, 본인은 이에 동의합니다.</span>
    </label>
    <div class="err hidden" id="errMsg"></div>
    <button class="btn btn-primary" onclick="submitForm()">📨 기도 시작</button>
  </div>

  <!-- 전송 중 -->
  <div id="stage-submitting" class="hidden center" style="margin-top:60px;">
    <div style="font-size:32px;">⏳</div>
    <p class="sub">저장 중...</p>
  </div>

  <!-- 완료 -->
  <div id="stage-thanks" class="hidden center" style="margin-top:40px;">
    <div class="thanks-icon">✅</div>
    <p style="font-size:20px; font-weight:700; margin:8px 0;">감사합니다, <span id="thanksName"></span>님</p>
    <p class="sub" style="margin-bottom:32px;">나눠주신 이야기 소중히 기억하겠습니다.</p>
    <button class="btn btn-secondary" onclick="restart()">🔄 처음으로</button>
  </div>
</div>
<p style="text-align:center; color:#4c1d95; font-size:11px; margin-top:24px;">build v9.1-note</p>

<script>
// ===== 설정: Apps Script 배포 URL =====
const GAS_URL = "https://script.google.com/macros/s/AKfycbzqsazVxSTf7sTzBIjW7fJ0eMO_Ef4mAkt66rRzb9Yt24JmHT4rqqev33Cv8Bo4q8wL/exec";

const GENERAL_POOL = [
  { q: "세계에서 가장 넓은 대륙은?", options: ["아시아", "아프리카", "유럽", "북아메리카"], correct: 0, explain: "정답은 아시아입니다. 세계 육지 면적의 약 30%를 차지하는 가장 큰 대륙입니다." },
  { q: "인체에서 가장 큰 장기는?", options: ["간", "피부", "폐", "심장"], correct: 1, explain: "정답은 피부입니다. 성인 기준 약 2제곱미터로 몸 전체를 감싸는 가장 큰 장기입니다." },
  { q: "태양계에서 가장 큰 행성은?", options: ["지구", "목성", "토성", "화성"], correct: 1, explain: "정답은 목성입니다. 지구보다 약 11배나 큰 태양계 최대 행성입니다." },
  { q: "세계에서 가장 긴 강으로 알려진 것은?", options: ["나일강", "한강", "양쯔강", "미시시피강"], correct: 0, explain: "정답은 나일강입니다. 아프리카를 가로지르며 약 6,650km에 이릅니다." },
  { q: "커피가 처음 발견된 것으로 알려진 대륙은?", options: ["아프리카", "아시아", "남아메리카", "유럽"], correct: 0, explain: "정답은 아프리카입니다. 에티오피아 고원에서 커피나무가 처음 발견됐다고 전해집니다." },
  { q: "사람의 몸에서 뼈가 가장 많이 모여있는 부위는?", options: ["손", "발", "척추", "두개골"], correct: 0, explain: "정답은 손입니다. 한쪽 손에만 27개의 뼈가 있습니다." },
  { q: "지구 표면 중 물이 차지하는 비율은 대략 얼마?", options: ["50%", "60%", "71%", "85%"], correct: 2, explain: "정답은 약 71%입니다. 지구는 그래서 '푸른 행성'이라고도 불립니다." },
  { q: "우리 몸에서 가장 단단한 부분은?", options: ["뼈", "치아", "손톱", "연골"], correct: 1, explain: "정답은 치아(치아 에나멜)입니다. 뼈보다도 단단한, 인체에서 가장 단단한 조직입니다." },
];

const QUESTION_POOL = [
  { q: "하나님이 아브라함에게 바치라고 명하신 아들의 이름은?", options: ["이삭", "이스마엘", "야곱", "에서"], correct: 0, explain: "정답은 이삭입니다. 하나님은 아브라함의 믿음을 시험하기 위해 아들 이삭을 번제로 바치라 하셨고, 순종하자 천사가 막고 대신 숫양을 예비하셨습니다." },
  { q: "모세가 이스라엘 백성을 이끌고 건넌 바다는?", options: ["갈릴리 바다", "홍해", "사해", "지중해"], correct: 1, explain: "정답은 홍해입니다. 모세가 지팡이를 들자 하나님이 바다를 갈라 이스라엘 백성이 마른 땅으로 건넜습니다." },
  { q: "다윗이 물맷돌로 쓰러뜨린 블레셋 장수는?", options: ["아비멜렉", "골리앗", "삼손", "느부갓네살"], correct: 1, explain: "정답은 골리앗입니다. 다윗은 물맷돌 하나로 거인 장수 골리앗을 쓰러뜨렸습니다." },
  { q: "요셉의 형들이 요셉을 판 대상은?", options: ["애굽 상인", "미디안/이스마엘 상인", "블레셋 사람", "모압 사람"], correct: 1, explain: "정답은 미디안, 이스마엘 상인입니다. 형들은 시기하여 요셉을 상인들에게 팔았습니다." },
  { q: "사자굴에 들어갔으나 살아난 선지자는?", options: ["다니엘", "엘리야", "엘리사", "이사야"], correct: 0, explain: "정답은 다니엘입니다. 기도를 멈추지 않아 사자굴에 던져졌지만 하나님이 지켜주셨습니다." },
  { q: "예수님이 물을 포도주로 바꾼 곳은?", options: ["가나 혼인잔치", "가버나움", "베다니", "여리고"], correct: 0, explain: "정답은 가나 혼인잔치입니다. 예수님의 첫 표적이었습니다." },
  { q: "예수님을 세 번 부인한 제자는?", options: ["요한", "베드로", "안드레", "빌립"], correct: 1, explain: "정답은 베드로입니다. 닭 울기 전 세 번 부인했다가 크게 통곡했습니다." },
  { q: "예수님이 태어나신 마을은?", options: ["나사렛", "베들레헴", "예루살렘", "가버나움"], correct: 1, explain: "정답은 베들레헴입니다. 다윗의 고향에서 예수님이 나셨습니다." },
];
const FINAL_BIBLE_QUESTION = {
  q: "세상을 창조하신 분은 누구일까요?",
  options: ["하나님", "제우스", "알에서 나온 박혁거세", "노아"],
  correct: 0,
  explain: "정답은 하나님입니다. 성경은 창세기 1장에서 하나님이 말씀으로 하늘과 땅, 그리고 모든 생명을 창조하셨다고 말합니다.",
};

const CONCERN_OPTIONS = ["중독", "가정", "관계", "진로", "건강", "돈"];
const NUM_GENERAL = 6;

let questions = [];
let qIdx = 0;
let selectedOption = null;
let concerns = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) {
  ["stage-setup","stage-question","stage-concerns","stage-concern-detail","stage-contact","stage-submitting","stage-thanks"]
    .forEach(s => document.getElementById(s).classList.toggle("hidden", s !== id));
}
function currentQ() { return questions[qIdx]; }

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function startQuiz() {
  const general = shuffle(GENERAL_POOL).slice(0, NUM_GENERAL);
  questions = [...general, FINAL_BIBLE_QUESTION];
  qIdx = 0;
  renderQuestion();
  show("stage-question");
}

function renderQuestion() {
  selectedOption = null;
  const q = currentQ();
  document.getElementById("qcounter").textContent = `문제 ${qIdx + 1} / ${questions.length}`;
  document.getElementById("qtext").textContent = q.q;
  document.getElementById("btn-reveal").classList.remove("hidden");
  document.getElementById("reveal-block").classList.add("hidden");

  const optWrap = document.getElementById("options");
  optWrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
    b.onclick = () => selectOption(i);
    optWrap.appendChild(b);
  });
}

function selectOption(i) {
  selectedOption = i;
  document.querySelectorAll("#options .opt").forEach((el, idx) => {
    el.classList.toggle("selected", idx === i);
  });
}

function reveal() {
  const q = currentQ();
  document.querySelectorAll("#options .opt").forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.correct) el.classList.add("correct");
  });
  document.getElementById("btn-reveal").classList.add("hidden");
  document.getElementById("explaintext").textContent = q.explain;
  document.getElementById("reveal-block").classList.remove("hidden");
  document.getElementById("btn-next").textContent = (qIdx + 1 >= questions.length) ? "나눔으로 이동 →" : "다음 문제 →";
  speak(q.explain);
}

function nextAfterReveal() {
  qIdx++;
  if (qIdx >= questions.length) {
    renderConcerns();
    show("stage-concerns");
  } else {
    renderQuestion();
  }
}

function renderConcerns() {
  concerns = [];
  const grid = document.getElementById("concernsGrid");
  grid.innerHTML = "";
  CONCERN_OPTIONS.forEach(c => {
    const b = document.createElement("button");
    b.className = "concern-btn";
    b.textContent = c;
    b.onclick = () => {
      if (concerns.includes(c)) {
        concerns = concerns.filter(x => x !== c);
        b.classList.remove("selected");
      } else {
        concerns.push(c);
        b.classList.add("selected");
      }
    };
    grid.appendChild(b);
  });
}

function goConcernDetail() {
  document.getElementById("concernNote").value = "";
  show("stage-concern-detail");
}

function goContact() {
  show("stage-contact");
}

async function submitForm() {
  const name = document.getElementById("nameInput").value.trim();
  const phone = document.getElementById("phoneInput").value.trim();
  const errEl = document.getElementById("errMsg");
  errEl.classList.add("hidden");

  if (!name || !phone) {
    errEl.textContent = "이름과 연락처를 입력해주세요";
    errEl.classList.remove("hidden");
    return;
  }
  if (!document.getElementById("agreeCheck").checked) {
    errEl.textContent = "개인정보 활용 동의가 필요합니다";
    errEl.classList.remove("hidden");
    return;
  }

  show("stage-submitting");
  try {
    const params = new URLSearchParams({
      name: name,
      phone: phone,
      concerns: concerns.join(", "),
      note: document.getElementById("concernNote").value.trim(),
    });
    await fetch(GAS_URL + "?" + params.toString(), {
      method: "GET",
      mode: "no-cors",
    });
    document.getElementById("thanksName").textContent = name;
    show("stage-thanks");
  } catch (err) {
    show("stage-contact");
    errEl.textContent = "전송 실패: " + (err && err.message ? err.message : String(err));
    errEl.classList.remove("hidden");
  }
}

function restart() {
  questions = []; qIdx = 0; selectedOption = null; concerns = [];
  document.getElementById("nameInput").value = "";
  document.getElementById("phoneInput").value = "";
  document.getElementById("agreeCheck").checked = false;
  document.getElementById("concernNote").value = "";
  show("stage-setup");
}
</script>
</body>
</html>
