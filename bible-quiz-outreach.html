<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캠페인 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(to bottom, #1e1b4b, #312e81, #0f172a);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
    font-size: 17px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 26px; text-align: center; margin: 0 0 28px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .badge { background:#fbbf24; color:#1e1b4b; border-radius:999px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  p.sub { color:#a5b4fc; font-size:17px; text-align:center; margin-bottom:28px; line-height:1.5; }
  .btn {
    width:100%; border:none; border-radius:14px; padding:20px; font-weight:700; font-size:19px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-primary { background:#fbbf24; color:#1e1b4b; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-secondary { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); }
  .qcard { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:26px 22px; margin-bottom:20px; }
  .qcard p { font-size:23px; font-weight:700; line-height:1.45; margin:0; }
  .options { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .opt {
    text-align:left; padding:18px 20px; border-radius:14px; font-size:18px; font-weight:600;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#fff; cursor:pointer;
    line-height:1.4;
  }
  .opt.selected { background:rgba(251,191,36,.25); border-color:#fbbf24; }
  .opt.correct { background:rgba(16,185,129,.3); border-color:#34d399; }
  .opt:disabled { cursor:default; }
  .explain-box { background:rgba(16,185,129,.1); border:1px solid rgba(52,211,153,.3); border-radius:14px; padding:20px; margin-bottom:20px; }
  .explain-box p { font-size:17px; line-height:1.65; margin:0 0 10px; }
  .replay { background:none; border:none; color:#6ee7b7; font-size:15px; text-decoration:underline; cursor:pointer; padding:0; }
  .row-top { display:flex; justify-content:space-between; align-items:center; font-size:15px; color:#a5b4fc; margin-bottom:16px; }
  .concerns { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:28px; }
  .concern-btn { padding:22px; border-radius:14px; font-weight:700; font-size:18px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; cursor:pointer; }
  .concern-btn.selected { background:rgba(251,113,133,.25); border-color:#fb7185; color:#fecdd3; }
  input[type=text], input[type=tel] {
    width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px;
    padding:18px 20px; color:#fff; font-size:18px; margin-bottom:14px; outline:none;
  }
  input::placeholder { color:#818cf8; }
  .center { text-align:center; }
  .err { color:#f87171; font-size:16px; text-align:center; margin-bottom:14px; }
  .hidden { display:none; }
  .heart { font-size:44px; margin-bottom:10px; }
  .thanks-icon { font-size:72px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="badge">🎉</span> 캠페인 퀴즈</h1>
  <p class="sub" style="margin-top:-16px; font-weight:700; color:#fbbf24;">3개 이상 맞추면 선물이 팡팡!!</p>

  <!-- 시작 화면 -->
  <div id="stage-setup">
    <p class="sub">가볍게 즐기는 상식 퀴즈 6개와 성경 퀴즈 1개, 그리고 함께 나눌 고민을 골라보는 시간을 가집니다.</p>
    <button class="btn btn-primary" onclick="startQuiz()">시작하기</button>
  </div>

  <!-- 문제 화면 -->
  <div id="stage-question" class="hidden">
    <div class="row-top">
      <span id="qcounter"></span>
      <span>편하게 답해보세요</span>
    </div>
    <div class="qcard"><p id="qtext"></p></div>
    <div class="options" id="options"></div>
    <button class="btn btn-primary hidden" id="btn-reveal" onclick="reveal()">정답 공개</button>

    <div id="reveal-block" class="hidden">
      <div class="explain-box">
        <p id="explaintext"></p>
        <button class="replay" onclick="speak(currentQ().explain)">🔊 다시 듣기</button>
      </div>
      <button class="btn btn-primary" id="btn-next" onclick="nextAfterReveal()">다음 문제 →</button>
    </div>
  </div>

  <!-- 고민 선택 -->
  <div id="stage-concerns" class="hidden">
    <div class="center">
      <div class="heart">💗</div>
      <p style="font-weight:700; font-size:18px; margin:4px 0;">요즘 마음에 있는 고민이 있다면</p>
      <p class="sub">해당하는 것을 모두 골라주세요</p>
    </div>
    <div class="concerns" id="concernsGrid"></div>
    <button class="btn btn-primary" onclick="goConcernDetail()">다음 →</button>
  </div>

  <!-- 고민 직접 작성 -->
  <div id="stage-concern-detail" class="hidden">
    <p class="sub">조금 더 편하게 이야기해주셔도 좋아요 (선택)</p>
    <textarea id="concernNote" rows="5" placeholder="자유롭게 적어주세요..." style="width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:16px; color:#fff; font-size:17px; margin-bottom:20px; outline:none; resize:vertical; font-family:inherit;"></textarea>
    <button class="btn btn-primary" onclick="goContact()">다음 →</button>
  </div>

  <!-- 연락처 -->
  <div id="stage-contact" class="hidden">
    <p class="sub">나중에 더 이야기 나눌 수 있도록 연락처를 남겨주세요</p>
    <input type="text" id="nameInput" placeholder="이름" />
    <input type="tel" id="phoneInput" placeholder="연락처 (010-0000-0000)" />
    <label style="display:flex; align-items:flex-start; gap:10px; font-size:14px; color:#c7d2fe; margin-bottom:16px; line-height:1.5; cursor:pointer;">
      <input type="checkbox" id="agreeCheck" style="width:20px; height:20px; margin-top:2px; flex-shrink:0;" />
      <span>입력하신 이름과 연락처는 상담 및 후속 안내 목적으로만 활용되며, 본인은 이에 동의합니다.</span>
    </label>
    <div class="err hidden" id="errMsg"></div>
    <button class="btn btn-primary" onclick="submitForm()">📨 기도 시작</button>
  </div>

  <!-- 전송 중 -->
  <div id="stage-submitting" class="hidden center" style="margin-top:60px;">
    <div style="font-size:32px;">⏳</div>
    <p class="sub">저장 중...</p>
  </div>

  <!-- 완료 -->
  <div id="stage-thanks" class="hidden center" style="margin-top:40px;">
    <div class="thanks-icon">✅</div>
    <p style="font-size:20px; font-weight:700; margin:8px 0;">감사합니다, <span id="thanksName"></span>님</p>
    <p class="sub" style="margin-bottom:32px;">나눠주신 이야기 소중히 기억하겠습니다.</p>
    <button class="btn btn-secondary" onclick="restart()">🔄 처음으로</button>
  </div>
</div>
<p style="text-align:center; color:#4c1d95; font-size:11px; margin-top:24px;">build v11-100q</p>

<script>
// ===== 설정: Apps Script 배포 URL =====
const GAS_URL = "https://script.google.com/macros/s/AKfycbzTdN_jjkfD0uOsnbbi4ct2CbTPxa5AAw6zHXbxdW0K50xRPJrnHhVc0feEpK3d_NT4/exec";

const GENERAL_POOL = [
  { q: "세계에서 가장 넓은 대륙은?", options: ["아시아", "아프리카", "유럽", "북아메리카"], correct: 0, explain: "정답은 아시아입니다. 세계 육지 면적의 약 30%를 차지하는 가장 큰 대륙입니다." },
  { q: "인체에서 가장 큰 장기는?", options: ["간", "피부", "폐", "심장"], correct: 1, explain: "정답은 피부입니다. 성인 기준 약 2제곱미터로 몸 전체를 감싸는 가장 큰 장기입니다." },
  { q: "태양계에서 가장 큰 행성은?", options: ["지구", "목성", "토성", "화성"], correct: 1, explain: "정답은 목성입니다. 지구보다 약 11배나 큰 태양계 최대 행성입니다." },
  { q: "세계에서 가장 긴 강으로 알려진 것은?", options: ["나일강", "한강", "양쯔강", "미시시피강"], correct: 0, explain: "정답은 나일강입니다. 아프리카를 가로지르며 약 6,650km에 이릅니다." },
  { q: "커피가 처음 발견된 것으로 알려진 대륙은?", options: ["아프리카", "아시아", "남아메리카", "유럽"], correct: 0, explain: "정답은 아프리카입니다. 에티오피아 고원에서 커피나무가 처음 발견됐다고 전해집니다." },
  { q: "사람의 몸에서 뼈가 가장 많이 모여있는 부위는?", options: ["손", "발", "척추", "두개골"], correct: 0, explain: "정답은 손입니다. 한쪽 손에만 27개의 뼈가 있습니다." },
  { q: "지구 표면 중 물이 차지하는 비율은 대략 얼마?", options: ["50%", "60%", "71%", "85%"], correct: 2, explain: "정답은 약 71%입니다. 지구는 그래서 '푸른 행성'이라고도 불립니다." },
  { q: "우리 몸에서 가장 단단한 부분은?", options: ["뼈", "치아", "손톱", "연골"], correct: 1, explain: "정답은 치아(치아 에나멜)입니다. 뼈보다도 단단한, 인체에서 가장 단단한 조직입니다." },
  { q: "지구에서 가장 빠른 육상 동물은?", options: ["사자", "치타", "말", "캥거루"], correct: 1, explain: "정답은 치타입니다. 순간 최고 속력이 시속 100km가 넘습니다." },
  { q: "세계에서 가장 높은 산은?", options: ["에베레스트산", "킬리만자로산", "몽블랑산", "후지산"], correct: 0, explain: "정답은 에베레스트산입니다. 해발고도 약 8,849m로 세계에서 가장 높습니다." },
  { q: "무지개는 보통 몇 가지 색으로 이야기되나요?", options: ["5가지", "6가지", "7가지", "8가지"], correct: 2, explain: "정답은 7가지(빨주노초파남보)입니다. 뉴턴이 음계에 맞춰 7색으로 정리했다고 전해집니다." },
  { q: "꿀벌이 꽃가루를 옮기는 행동을 무엇이라 하나요?", options: ["광합성", "수분(가루받이)", "발효", "증산"], correct: 1, explain: "정답은 수분입니다. 벌이 꽃가루를 옮겨주면서 식물의 번식을 돕습니다." },
  { q: "우리 몸에서 피를 온몸으로 보내는 기관은?", options: ["폐", "심장", "간", "위"], correct: 1, explain: "정답은 심장입니다. 하루에 약 10만 번 이상 뛰며 혈액을 순환시킵니다." },
  { q: "1년 중 낮이 가장 긴 날을 무엇이라 하나요?", options: ["동지", "하지", "춘분", "추분"], correct: 1, explain: "정답은 하지입니다. 보통 6월 21일 무렵으로 태양이 가장 오래 떠 있는 날입니다." },
  { q: "세계에서 인구가 가장 많은 나라는?(2020년대 기준)", options: ["중국", "인도", "미국", "인도네시아"], correct: 1, explain: "정답은 인도입니다. 최근 인구 통계에서 중국을 넘어선 것으로 알려져 있습니다." },
  { q: "물의 어는점은 섭씨 몇 도인가요?", options: ["0도", "10도", "-10도", "5도"], correct: 0, explain: "정답은 섭씨 0도입니다. 반대로 끓는점은 100도(1기압 기준)입니다." },
  { q: "사람이 잠을 잘 때 가장 많이 꿈을 꾸는 수면 단계는?", options: ["렘수면", "얕은 수면", "깊은 수면", "가수면"], correct: 0, explain: "정답은 렘(REM)수면입니다. 눈동자가 빠르게 움직이며 생생한 꿈을 꾸는 단계입니다." },
  { q: "지구가 태양을 한 바퀴 도는 데 걸리는 시간은?", options: ["약 1개월", "약 6개월", "약 1년", "약 10년"], correct: 2, explain: "정답은 약 1년(365일)입니다. 이 공전 주기가 1년의 기준이 됩니다." },
  { q: "다음 중 포유류가 아닌 동물은?", options: ["고래", "박쥐", "펭귄", "돌고래"], correct: 2, explain: "정답은 펭귄입니다. 펭귄은 알을 낳는 조류이며, 고래·박쥐·돌고래는 모두 포유류입니다." },
  { q: "피아노 건반은 총 몇 개인가요? (표준 기준)", options: ["76개", "88개", "96개", "108개"], correct: 1, explain: "정답은 88개입니다. 흰건반 52개와 검은건반 36개로 이루어져 있습니다." },
  { q: "우리 몸에서 산소를 흡수하는 기관은?", options: ["폐", "간", "위", "신장"], correct: 0, explain: "정답은 폐입니다. 숨을 들이쉴 때 산소를 흡수하고 이산화탄소를 내보냅니다." },
  { q: "세계에서 가장 작은 대륙은?", options: ["오세아니아", "유럽", "남극", "남아메리카"], correct: 0, explain: "정답은 오세아니아입니다. 호주를 중심으로 한 가장 작은 대륙입니다." },
  { q: "번개가 친 후 천둥소리가 늦게 들리는 이유는?", options: ["빛보다 소리가 느려서", "소리가 더 멀리 가서", "번개가 나중에 발생해서", "우연"], correct: 0, explain: "정답은 빛의 속도가 소리보다 훨씬 빠르기 때문입니다. 그래서 번개가 먼저 보이고 천둥이 나중에 들립니다." },
  { q: "다음 중 곤충이 아닌 것은?", options: ["개미", "거미", "나비", "벌"], correct: 1, explain: "정답은 거미입니다. 거미는 다리가 8개인 절지동물로 곤충(다리 6개)이 아닙니다." },
  { q: "축구 경기 한 팀의 선수는 몇 명인가요? (필드 위)", options: ["9명", "10명", "11명", "12명"], correct: 2, explain: "정답은 11명입니다. 골키퍼 포함 11명이 한 팀으로 경기를 뜁니다." },
  { q: "올림픽은 몇 년마다 열리나요?", options: ["2년", "3년", "4년", "5년"], correct: 2, explain: "정답은 4년입니다. 하계·동계 올림픽 모두 4년 주기로 열립니다." },
  { q: "사람 몸에서 가장 긴 뼈는?", options: ["팔뼈", "다리뼈(대퇴골)", "갈비뼈", "척추뼈"], correct: 1, explain: "정답은 대퇴골(넓적다리뼈)입니다. 몸에서 가장 길고 튼튼한 뼈입니다." },
  { q: "지구의 위성(달)은 몇 개인가요?", options: ["0개", "1개", "2개", "3개"], correct: 1, explain: "정답은 1개입니다. 지구는 달이라는 자연 위성 하나를 가지고 있습니다." },
  { q: "다음 중 초식동물은?", options: ["사자", "호랑이", "기린", "늑대"], correct: 2, explain: "정답은 기린입니다. 나뭇잎을 주로 먹는 대표적인 초식동물입니다." },
  { q: "우리나라 화폐 단위는?", options: ["엔", "위안", "원", "달러"], correct: 2, explain: "정답은 원(₩)입니다. 대한민국의 공식 화폐 단위입니다." },
  { q: "물이 수증기로 변하는 현상을 무엇이라 하나요?", options: ["응결", "증발", "융해", "승화"], correct: 1, explain: "정답은 증발입니다. 액체가 기체로 변하는 현상을 말합니다." },
  { q: "세계에서 가장 큰 바다는?", options: ["대서양", "태평양", "인도양", "북극해"], correct: 1, explain: "정답은 태평양입니다. 지구 표면의 약 3분의 1을 차지하는 가장 큰 바다입니다." },
  { q: "1시간은 몇 분인가요?", options: ["50분", "60분", "70분", "100분"], correct: 1, explain: "정답은 60분입니다. 1분은 60초이고, 1시간은 60분입니다." },
  { q: "다음 중 새(조류)가 아닌 것은?", options: ["타조", "박쥐", "독수리", "참새"], correct: 1, explain: "정답은 박쥐입니다. 박쥐는 날아다니지만 새가 아니라 포유류입니다." },
  { q: "사람의 정상 체온은 대략 몇 도인가요?", options: ["30도", "33도", "36.5도", "40도"], correct: 2, explain: "정답은 약 36.5도입니다. 사람마다 조금씩 다르지만 평균 체온입니다." },
  { q: "달이 지구를 도는 데 걸리는 시간은 대략?", options: ["1일", "1주일", "약 한 달", "1년"], correct: 2, explain: "정답은 약 한 달(약 27~29일)입니다. 이 주기가 달력의 '월' 개념의 기원이 됐습니다." },
  { q: "인체에서 가장 작은 뼈가 있는 곳은?", options: ["귀", "손", "발", "코"], correct: 0, explain: "정답은 귀입니다. '등자뼈'라는 아주 작은 뼈가 귀 안에 있습니다." },
  { q: "물의 화학식은?", options: ["CO2", "H2O", "O2", "NaCl"], correct: 1, explain: "정답은 H2O입니다. 수소 원자 2개와 산소 원자 1개로 이루어져 있습니다." },
  { q: "태양계에서 태양과 가장 가까운 행성은?", options: ["금성", "수성", "지구", "화성"], correct: 1, explain: "정답은 수성입니다. 태양계에서 태양에 가장 가까운 첫 번째 행성입니다." },
  { q: "세계에서 가장 큰 섬은?", options: ["그린란드", "마다가스카르", "보르네오섬", "뉴기니섬"], correct: 0, explain: "정답은 그린란드입니다. 대륙으로 분류되지 않는 섬 중 가장 큽니다." },
  { q: "사람의 기본 혈액형은 총 몇 가지인가요?", options: ["2가지", "3가지", "4가지", "5가지"], correct: 2, explain: "정답은 4가지(A, B, AB, O)입니다." },

  { q: "벌집은 주로 어떤 모양으로 이루어져 있나요?", options: ["삼각형", "사각형", "육각형", "원형"], correct: 2, explain: "정답은 육각형입니다. 공간을 가장 효율적으로 쓸 수 있는 구조로 알려져 있습니다." },
  { q: "눈(雪)의 결정은 보통 몇 각형인가요?", options: ["오각형", "육각형", "칠각형", "팔각형"], correct: 1, explain: "정답은 육각형입니다. 물 분자의 구조 때문에 대부분 육각형 결정을 이룹니다." },
  { q: "세계에서 가장 깊은 바다(해구)는?", options: ["마리아나 해구", "필리핀 해구", "일본 해구", "자바 해구"], correct: 0, explain: "정답은 마리아나 해구입니다. 깊이가 약 11,000m에 이릅니다." },
  { q: "전통적인 축구공은 보통 몇 개의 조각으로 이루어지나요?", options: ["12개", "20개", "32개", "40개"], correct: 2, explain: "정답은 32개입니다. 오각형 12개와 육각형 20개 조각으로 이루어진 형태가 전통적입니다." },
  { q: "야구 한 팀의 선발 선수는 몇 명인가요?", options: ["8명", "9명", "10명", "11명"], correct: 1, explain: "정답은 9명입니다. 수비 위치 9곳에 각각 한 명씩 섭니다." },
  { q: "농구 한 팀이 코트에서 뛰는 선수는 몇 명인가요?", options: ["4명", "5명", "6명", "7명"], correct: 1, explain: "정답은 5명입니다. 한 팀당 5명이 코트 위에서 경기합니다." },
  { q: "배구 한 팀이 코트에서 뛰는 선수는 몇 명인가요?", options: ["5명", "6명", "7명", "8명"], correct: 1, explain: "정답은 6명입니다. 로테이션을 돌며 포지션을 바꿉니다." },
  { q: "1킬로그램은 몇 그램인가요?", options: ["100g", "1,000g", "10,000g", "100,000g"], correct: 1, explain: "정답은 1,000g입니다. '킬로'는 1,000배를 뜻하는 접두어입니다." },
  { q: "지구 대기 중 가장 많은 비중을 차지하는 기체는?", options: ["산소", "질소", "이산화탄소", "수소"], correct: 1, explain: "정답은 질소입니다. 대기의 약 78%를 차지합니다." },
  { q: "사람이 숨을 내쉴 때 주로 배출하는 기체는?", options: ["산소", "질소", "이산화탄소", "수소"], correct: 2, explain: "정답은 이산화탄소입니다. 몸속에서 에너지를 만들고 남은 것을 내보냅니다." },
  { q: "식물이 광합성으로 만들어내는 기체는?", options: ["이산화탄소", "질소", "산소", "수소"], correct: 2, explain: "정답은 산소입니다. 식물은 빛을 이용해 이산화탄소와 물로 산소와 양분을 만듭니다." },
  { q: "낙타의 등에 있는 혹의 주된 역할은?", options: ["물 저장", "지방 저장", "체온 조절", "장식"], correct: 1, explain: "정답은 지방 저장입니다. 사막에서 오래 버틸 수 있도록 에너지를 혹에 저장합니다." },
  { q: "문어의 다리는 몇 개인가요?", options: ["6개", "8개", "10개", "12개"], correct: 1, explain: "정답은 8개입니다. 문어는 8개의 다리를 가진 연체동물입니다." },
  { q: "거미의 다리는 몇 개인가요?", options: ["6개", "8개", "10개", "4개"], correct: 1, explain: "정답은 8개입니다. 그래서 거미는 곤충이 아니라 절지동물로 분류됩니다." },
  { q: "지구에서 몸집이 가장 큰 동물로 알려진 것은?", options: ["아프리카코끼리", "대왕고래", "백상아리", "기린"], correct: 1, explain: "정답은 대왕고래(흰긴수염고래)입니다. 역대 지구상에 존재했던 동물 중 가장 큽니다." },
  { q: "기린의 목뼈 개수는 사람과 비교하면 어떨까요?", options: ["사람보다 훨씬 많다", "사람과 같은 7개다", "사람보다 적다", "목뼈가 없다"], correct: 1, explain: "정답은 사람과 같은 7개입니다. 목이 길 뿐 뼈의 개수는 사람과 동일합니다." },
  { q: "남극과 북극 중 더 추운 곳은 어디로 알려져 있나요?", options: ["북극", "남극", "둘 다 같다", "계절마다 다르다"], correct: 1, explain: "정답은 남극입니다. 남극은 대륙 위에 얼음이 쌓여 있어 평균 기온이 더 낮습니다." },
  { q: "사람의 유전 정보(DNA)가 저장되어 있는 세포 속 장소는?", options: ["세포막", "세포핵", "미토콘드리아", "세포질"], correct: 1, explain: "정답은 세포핵입니다. DNA는 세포핵 안에 실 모양으로 저장되어 있습니다." },
  { q: "커피에 들어있는 대표적인 각성 성분은?", options: ["카페인", "니코틴", "타닌", "포도당"], correct: 0, explain: "정답은 카페인입니다. 졸음을 쫓고 집중력을 높이는 데 도움을 줍니다." },
  { q: "초콜릿의 주 원료가 되는 열매는?", options: ["카카오", "커피콩", "바닐라", "아몬드"], correct: 0, explain: "정답은 카카오입니다. 카카오 열매의 씨앗을 가공해 초콜릿을 만듭니다." },

  { q: "김치의 주재료가 되는 채소는?", options: ["무", "배추", "오이", "당근"], correct: 1, explain: "정답은 배추입니다. 배추김치가 가장 대표적인 김치입니다." },
  { q: "종이를 처음 만든 것으로 널리 알려진 나라는?", options: ["이집트", "중국", "그리스", "인도"], correct: 1, explain: "정답은 중국입니다. 후한시대 채륜이 제지법을 개량한 것으로 널리 알려져 있습니다." },
  { q: "현존하는 세계 최고(最古)의 금속활자 인쇄본으로 알려진 것은?", options: ["직지심체요절", "성경", "논어", "훈민정음"], correct: 0, explain: "정답은 직지심체요절입니다. 고려시대에 만들어진, 현존하는 가장 오래된 금속활자본으로 알려져 있습니다." },
  { q: "태극기의 네 모서리에 있는 문양(괘)은 총 몇 개인가요?", options: ["3개", "4개", "5개", "6개"], correct: 1, explain: "정답은 4개(건·곤·감·리)입니다." },
  { q: "대한민국의 수도는?", options: ["부산", "서울", "인천", "대전"], correct: 1, explain: "정답은 서울입니다." },

  { q: "세계에서 영토가 가장 작은 나라로 알려진 곳은?", options: ["모나코", "바티칸시국", "싱가포르", "몰디브"], correct: 1, explain: "정답은 바티칸시국입니다. 면적이 약 0.44제곱킬로미터에 불과합니다." },
  { q: "피라미드로 유명한 나라는?", options: ["이집트", "그리스", "터키", "이란"], correct: 0, explain: "정답은 이집트입니다. 기자의 피라미드가 대표적입니다." },
  { q: "에펠탑이 있는 도시는?", options: ["런던", "파리", "로마", "베를린"], correct: 1, explain: "정답은 파리입니다." },
  { q: "자유의 여신상이 있는 도시는?", options: ["보스턴", "뉴욕", "워싱턴 D.C.", "필라델피아"], correct: 1, explain: "정답은 뉴욕입니다." },
  { q: "만리장성이 있는 나라는?", options: ["일본", "몽골", "중국", "베트남"], correct: 2, explain: "정답은 중국입니다." },
  { q: "인류 최초로 달에 착륙한 유인 우주선 임무의 이름은?", options: ["보이저 1호", "아폴로 11호", "스푸트니크 1호", "제미니 4호"], correct: 1, explain: "정답은 아폴로 11호입니다. 1969년 인류 최초로 달에 착륙했습니다." },
  { q: "컴퓨터에서 '두뇌' 역할을 하는 핵심 부품은?", options: ["RAM", "CPU", "하드디스크", "모니터"], correct: 1, explain: "정답은 CPU(중앙처리장치)입니다. 컴퓨터의 모든 연산을 처리합니다." },
  { q: "무지개가 생기는 주된 원리는?", options: ["빛의 굴절과 반사", "소리의 반사", "바람의 흐름", "기압 차이"], correct: 0, explain: "정답은 빛의 굴절과 반사입니다. 물방울 속에서 빛이 꺾이고 반사되며 여러 색으로 나뉩니다." },
  { q: "소리와 빛 중 속도가 더 빠른 것은?", options: ["소리", "빛", "둘 다 같다", "상황에 따라 다르다"], correct: 1, explain: "정답은 빛입니다. 빛의 속도는 소리보다 훨씬 빠릅니다." },
  { q: "자석에는 보통 몇 개의 극이 있나요?", options: ["1개", "2개", "3개", "4개"], correct: 1, explain: "정답은 2개(N극과 S극)입니다." },
  { q: "방향을 알려주는, 자기장을 이용한 도구는?", options: ["온도계", "나침반", "청진기", "망원경"], correct: 1, explain: "정답은 나침반입니다. 지구 자기장을 이용해 방향을 알려줍니다." },
  { q: "평년 기준으로 1년은 며칠인가요?", options: ["360일", "365일", "366일", "370일"], correct: 1, explain: "정답은 365일입니다. 4년마다 오는 윤년만 366일입니다." },
  { q: "윤년은 몇 년마다 한 번씩 돌아오나요?", options: ["2년", "3년", "4년", "5년"], correct: 2, explain: "정답은 4년입니다. 2월이 29일까지 있는 해입니다." },
  { q: "사람의 심장은 몇 개의 방(심방·심실)으로 이루어져 있나요?", options: ["2개", "3개", "4개", "5개"], correct: 2, explain: "정답은 4개입니다. 좌심방, 우심방, 좌심실, 우심실로 구성됩니다." },
  { q: "몸에 상처가 났을 때 피를 굳게 하는 데 관여하는 혈액 성분은?", options: ["적혈구", "백혈구", "혈소판", "혈장"], correct: 2, explain: "정답은 혈소판입니다. 상처 부위에서 뭉쳐 지혈을 돕습니다." },
  { q: "감기와 독감을 일으키는 주된 원인은?", options: ["세균", "바이러스", "곰팡이", "기생충"], correct: 1, explain: "정답은 바이러스입니다. 그래서 항생제가 아니라 충분한 휴식과 증상 관리가 중요합니다." },
  { q: "질병의 원인체를 약하게 만들어 몸에 넣어 면역을 기르는 것은?", options: ["백신", "항생제", "진통제", "영양제"], correct: 0, explain: "정답은 백신입니다. 미리 면역력을 길러 실제 질병을 예방하는 데 도움을 줍니다." },
  { q: "다음 중 대한민국의 전통 명절이 아닌 것은?", options: ["설날", "추석", "할로윈", "정월대보름"], correct: 2, explain: "정답은 할로윈입니다. 할로윈은 서양에서 유래한 기념일입니다." },
  { q: "우리나라의 전통 한복에서 여성이 입는 치마 위 상의를 무엇이라 하나요?", options: ["저고리", "두루마기", "buri", "배자"], correct: 0, explain: "정답은 저고리입니다. 한복 상의를 가리키는 명칭입니다." },
  { q: "지구에서 가장 큰 사막으로 알려진 곳은?", options: ["고비 사막", "사하라 사막", "칼라하리 사막", "아타카마 사막"], correct: 1, explain: "정답은 사하라 사막입니다. 아프리카 북부에 위치한 세계 최대 규모의 더운 사막입니다." },
  { q: "세계에서 가장 긴 산맥으로 알려진 것은?", options: ["히말라야산맥", "안데스산맥", "로키산맥", "알프스산맥"], correct: 1, explain: "정답은 안데스산맥입니다. 남아메리카 서쪽을 따라 약 7,000km 이상 뻗어 있습니다." },
  { q: "지구의 자전 때문에 생기는 현상은?", options: ["계절의 변화", "낮과 밤의 변화", "1년의 길이", "윤년"], correct: 1, explain: "정답은 낮과 밤의 변화입니다. 지구가 하루에 한 바퀴 자전하며 낮과 밤이 생깁니다." },
  { q: "지구의 공전 때문에 생기는 대표적인 현상은?", options: ["낮과 밤", "계절의 변화", "밀물과 썰물", "바람"], correct: 1, explain: "정답은 계절의 변화입니다. 지구가 태양 주위를 돌며 기울어진 축 때문에 계절이 바뀝니다." },
  { q: "달의 인력으로 생기는 바닷물의 오르내림 현상은?", options: ["해류", "밀물과 썰물", "파도", "쓰나미"], correct: 1, explain: "정답은 밀물과 썰물(조수 간만)입니다. 주로 달의 인력이 원인입니다." },
  { q: "다음 중 곡식이 아닌 것은?", options: ["쌀", "보리", "감자", "밀"], correct: 2, explain: "정답은 감자입니다. 감자는 뿌리(덩이줄기) 작물로, 곡식이 아니라 채소류로 분류됩니다." },
  { q: "대나무는 식물학적으로 어떤 종류에 속하나요?", options: ["나무", "풀(벼과 식물)", "덩굴식물", "이끼류"], correct: 1, explain: "정답은 풀(벼과 식물)입니다. 나무처럼 보이지만 사실 벼, 밀과 같은 벼과에 속합니다." },
  { q: "다음 중 사람이 만들어낸 인공위성이 아닌 것은?", options: ["달", "GPS 위성", "통신위성", "기상위성"], correct: 0, explain: "정답은 달입니다. 달은 지구의 자연 위성이며, 나머지는 사람이 쏘아 올린 인공위성입니다." },
  { q: "우리 몸에서 기억과 사고를 담당하는 기관은?", options: ["심장", "간", "뇌", "폐"], correct: 2, explain: "정답은 뇌입니다. 기억, 감정, 판단 등 대부분의 인지 활동을 담당합니다." },
  { q: "사람은 보통 하루에 몇 시간 정도 잠을 자는 것이 권장되나요?", options: ["3~4시간", "7~9시간", "12~14시간", "15시간 이상"], correct: 1, explain: "정답은 7~9시간입니다. 성인 기준 권장 수면 시간입니다." },
];

const QUESTION_POOL = [
  { q: "하나님이 아브라함에게 바치라고 명하신 아들의 이름은?", options: ["이삭", "이스마엘", "야곱", "에서"], correct: 0, explain: "정답은 이삭입니다. 하나님은 아브라함의 믿음을 시험하기 위해 아들 이삭을 번제로 바치라 하셨고, 순종하자 천사가 막고 대신 숫양을 예비하셨습니다." },
  { q: "모세가 이스라엘 백성을 이끌고 건넌 바다는?", options: ["갈릴리 바다", "홍해", "사해", "지중해"], correct: 1, explain: "정답은 홍해입니다. 모세가 지팡이를 들자 하나님이 바다를 갈라 이스라엘 백성이 마른 땅으로 건넜습니다." },
  { q: "다윗이 물맷돌로 쓰러뜨린 블레셋 장수는?", options: ["아비멜렉", "골리앗", "삼손", "느부갓네살"], correct: 1, explain: "정답은 골리앗입니다. 다윗은 물맷돌 하나로 거인 장수 골리앗을 쓰러뜨렸습니다." },
  { q: "요셉의 형들이 요셉을 판 대상은?", options: ["애굽 상인", "미디안/이스마엘 상인", "블레셋 사람", "모압 사람"], correct: 1, explain: "정답은 미디안, 이스마엘 상인입니다. 형들은 시기하여 요셉을 상인들에게 팔았습니다." },
  { q: "사자굴에 들어갔으나 살아난 선지자는?", options: ["다니엘", "엘리야", "엘리사", "이사야"], correct: 0, explain: "정답은 다니엘입니다. 기도를 멈추지 않아 사자굴에 던져졌지만 하나님이 지켜주셨습니다." },
  { q: "예수님이 물을 포도주로 바꾼 곳은?", options: ["가나 혼인잔치", "가버나움", "베다니", "여리고"], correct: 0, explain: "정답은 가나 혼인잔치입니다. 예수님의 첫 표적이었습니다." },
  { q: "예수님을 세 번 부인한 제자는?", options: ["요한", "베드로", "안드레", "빌립"], correct: 1, explain: "정답은 베드로입니다. 닭 울기 전 세 번 부인했다가 크게 통곡했습니다." },
  { q: "예수님이 태어나신 마을은?", options: ["나사렛", "베들레헴", "예루살렘", "가버나움"], correct: 1, explain: "정답은 베들레헴입니다. 다윗의 고향에서 예수님이 나셨습니다." },
];
const FINAL_BIBLE_QUESTION = {
  q: "세상을 창조하신 분은 누구일까요?",
  options: ["하나님", "제우스", "알에서 나온 박혁거세", "노아"],
  correct: 0,
  explain: "정답은 하나님입니다. 성경은 창세기 1장에서 하나님이 말씀으로 하늘과 땅, 그리고 모든 생명을 창조하셨다고 말합니다.",
};

const CONCERN_OPTIONS = ["중독", "가정", "관계", "진로", "건강", "돈"];
const NUM_GENERAL = 6;

let questions = [];
let qIdx = 0;
let selectedOption = null;
let concerns = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) {
  ["stage-setup","stage-question","stage-concerns","stage-concern-detail","stage-contact","stage-submitting","stage-thanks"]
    .forEach(s => document.getElementById(s).classList.toggle("hidden", s !== id));
}
function currentQ() { return questions[qIdx]; }

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function startQuiz() {
  const general = shuffle(GENERAL_POOL).slice(0, NUM_GENERAL);
  questions = [...general, FINAL_BIBLE_QUESTION];
  qIdx = 0;
  renderQuestion();
  show("stage-question");
}

function renderQuestion() {
  selectedOption = null;
  const q = currentQ();
  document.getElementById("qcounter").textContent = `문제 ${qIdx + 1} / ${questions.length}`;
  document.getElementById("qtext").textContent = q.q;
  document.getElementById("btn-reveal").classList.remove("hidden");
  document.getElementById("reveal-block").classList.add("hidden");

  const optWrap = document.getElementById("options");
  optWrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
    b.onclick = () => selectOption(i);
    optWrap.appendChild(b);
  });
}

function selectOption(i) {
  selectedOption = i;
  document.querySelectorAll("#options .opt").forEach((el, idx) => {
    el.classList.toggle("selected", idx === i);
  });
}

function reveal() {
  const q = currentQ();
  document.querySelectorAll("#options .opt").forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.correct) el.classList.add("correct");
  });
  document.getElementById("btn-reveal").classList.add("hidden");
  document.getElementById("explaintext").textContent = q.explain;
  document.getElementById("reveal-block").classList.remove("hidden");
  document.getElementById("btn-next").textContent = (qIdx + 1 >= questions.length) ? "나눔으로 이동 →" : "다음 문제 →";
  speak(q.explain);
}

function nextAfterReveal() {
  qIdx++;
  if (qIdx >= questions.length) {
    renderConcerns();
    show("stage-concerns");
  } else {
    renderQuestion();
  }
}

function renderConcerns() {
  concerns = [];
  const grid = document.getElementById("concernsGrid");
  grid.innerHTML = "";
  CONCERN_OPTIONS.forEach(c => {
    const b = document.createElement("button");
    b.className = "concern-btn";
    b.textContent = c;
    b.onclick = () => {
      if (concerns.includes(c)) {
        concerns = concerns.filter(x => x !== c);
        b.classList.remove("selected");
      } else {
        concerns.push(c);
        b.classList.add("selected");
      }
    };
    grid.appendChild(b);
  });
}

function goConcernDetail() {
  document.getElementById("concernNote").value = "";
  show("stage-concern-detail");
}

function goContact() {
  show("stage-contact");
}

async function submitForm() {
  const name = document.getElementById("nameInput").value.trim();
  const phone = document.getElementById("phoneInput").value.trim();
  const errEl = document.getElementById("errMsg");
  errEl.classList.add("hidden");

  if (!name || !phone) {
    errEl.textContent = "이름과 연락처를 입력해주세요";
    errEl.classList.remove("hidden");
    return;
  }
  if (!document.getElementById("agreeCheck").checked) {
    errEl.textContent = "개인정보 활용 동의가 필요합니다";
    errEl.classList.remove("hidden");
    return;
  }

  show("stage-submitting");
  try {
    const params = new URLSearchParams({
      name: name,
      phone: phone,
      concerns: concerns.join(", "),
      note: document.getElementById("concernNote").value.trim(),
    });
    await fetch(GAS_URL + "?" + params.toString(), {
      method: "GET",
      mode: "no-cors",
    });
    document.getElementById("thanksName").textContent = name;
    show("stage-thanks");
  } catch (err) {
    show("stage-contact");
    errEl.textContent = "전송 실패: " + (err && err.message ? err.message : String(err));
    errEl.classList.remove("hidden");
  }
}

function restart() {
  questions = []; qIdx = 0; selectedOption = null; concerns = [];
  document.getElementById("nameInput").value = "";
  document.getElementById("phoneInput").value = "";
  document.getElementById("agreeCheck").checked = false;
  document.getElementById("concernNote").value = "";
  show("stage-setup");
}
</script>
</body>
</html>
